buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'

// Forge 1.7.10 roda em Java 6 a 8. O mod e compilado para Java 8.
sourceCompatibility = 1.8
targetCompatibility = 1.8

version = project.mod_version + "-" + project.minecraft_version
group = project.mod_group
archivesBaseName = project.mod_name

minecraft {
    version = project.minecraft_version + "-" + project.forge_version
    runDir = project.run_dir
}

dependencies {
    // Coloque jars de dependencias em ./libs ou declare aqui.
    // Exemplo: compile "some.group:artifact:version"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // Substitui ${version} e ${mcversion} dentro do mcmod.info
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
}

// Codificacao dos fontes em UTF-8 (acentos nos comentarios)
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// Jar com os codigos-fonte
task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = "sources"
    from sourceSets.main.allSource
}

artifacts {
    archives sourcesJar
}


// Teste automatizado: runServer com -Dostest.run=true (mod ostest.jar
// em run/mods, compilado em MCP names contra as classes dev).
def runSrv = tasks.matching { it.name == 'runServer' }
configure(runSrv) {
    systemProperty 'ostest.run', 'true'
    systemProperty 'ostest.autostop', 'true'
}
